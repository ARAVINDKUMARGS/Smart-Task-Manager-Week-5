<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTask Pro — Automated Test Suite (InternNova Week 5)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --brand: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .title-group p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 150ms ease;
    }
    .back-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .summary-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      text-align: center;
    }
    .stat-box .num {
      font-size: 2rem;
      font-weight: 800;
      font-feature-settings: "tnum";
    }
    .stat-box .lbl {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .num.passed { color: var(--success); }
    .num.failed { color: var(--danger); }
    .num.total { color: var(--brand); }
    .num.rate { color: #38bdf8; }

    .test-suite {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .suite-header {
      padding: 14px 20px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .test-list {
      list-style: none;
    }
    .test-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-name {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .test-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-pass { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-fail { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .test-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .error-trace {
      margin-top: 6px;
      padding: 8px 12px;
      background-color: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--danger);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>SmartTask Pro — Test Automation Suite</h1>
        <p>InternNova Week 5 JavaScript Unit &amp; Integration Verification</p>
      </div>
      <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Dashboard
      </a>
    </header>

    <!-- Test Run Summary -->
    <section class="summary-card">
      <div class="stat-box">
        <div class="num total" id="totalTests">0</div>
        <div class="lbl">Total Tests</div>
      </div>
      <div class="stat-box">
        <div class="num passed" id="passedTests">0</div>
        <div class="lbl">Passed</div>
      </div>
      <div class="stat-box">
        <div class="num failed" id="failedTests">0</div>
        <div class="lbl">Failed</div>
      </div>
      <div class="stat-box">
        <div class="num rate" id="passRate">0%</div>
        <div class="lbl">Pass Rate</div>
      </div>
    </section>

    <!-- Results Display -->
    <main id="suitesContainer">
      <!-- Injected dynamically by test runner -->
    </main>
  </div>

  <script>
    'use strict';

    // Micro Test Runner Engine
    const TestRunner = {
      suites: [],
      currentSuite: null,

      describe(suiteName, fn) {
        this.currentSuite = { name: suiteName, tests: [] };
        this.suites.push(this.currentSuite);
        fn();
      },

      test(testName, fn) {
        const start = performance.now();
        let passed = true;
        let errorMessage = null;

        try {
          fn();
        } catch (err) {
          passed = false;
          errorMessage = err.message || String(err);
        }

        const duration = (performance.now() - start).toFixed(2);
        this.currentSuite.tests.push({
          name: testName,
          passed,
          duration,
          errorMessage
        });
      },

      expect(actual) {
        return {
          toBe(expected) {
            if (actual !== expected) {
              throw new Error(`Expected ${JSON.stringify(expected)}, but got ${JSON.stringify(actual)}`);
            }
          },
          toEqual(expected) {
            const actualStr = JSON.stringify(actual);
            const expectedStr = JSON.stringify(expected);
            if (actualStr !== expectedStr) {
              throw new Error(`Expected ${expectedStr}, but got ${actualStr}`);
            }
          },
          toBeTruthy() {
            if (!actual) throw new Error(`Expected truthy value, but received ${actual}`);
          },
          toBeFalsy() {
            if (actual) throw new Error(`Expected falsy value, but received ${actual}`);
          },
          toBeGreaterThan(val) {
            if (actual <= val) throw new Error(`Expected ${actual} > ${val}`);
          },
          toContain(item) {
            if (!actual || !actual.includes(item)) {
              throw new Error(`Expected collection to contain ${JSON.stringify(item)}`);
            }
          }
        };
      }
    };

    const { describe, test, expect } = TestRunner;

    /* ==========================================================================
       ISOLATED UNIT TESTS FOR TASK MANAGER LOGIC
       ========================================================================== */

    // Helper functions under test
    function getFormattedDateOffset(daysOffset = 0) {
      const date = new Date();
      date.setDate(date.getDate() + daysOffset);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isTaskOverdue(dueDateStr, isCompleted) {
      if (isCompleted || !dueDateStr) return false;
      const todayStr = getFormattedDateOffset(0);
      return dueDateStr < todayStr;
    }

    const PRIORITY_WEIGHTS = { High: 3, Medium: 2, Low: 1 };

    // --- SUITE 1: Task 1 & 3: Due Date & Date Math Engine ---
    describe('Task 3: Due Date & Overdue Calculation Engine', () => {
      test('Past due date on pending task should return isTaskOverdue = true', () => {
        const pastDate = getFormattedDateOffset(-3);
        expect(isTaskOverdue(pastDate, false)).toBeTruthy();
      });

      test('Past due date on COMPLETED task should return isTaskOverdue = false', () => {
        const pastDate = getFormattedDateOffset(-3);
        expect(isTaskOverdue(pastDate, true)).toBeFalsy();
      });

      test('Today due date should return isTaskOverdue = false', () => {
        const today = getFormattedDateOffset(0);
        expect(isTaskOverdue(today, false)).toBeFalsy();
      });

      test('Future due date should return isTaskOverdue = false', () => {
        const futureDate = getFormattedDateOffset(5);
        expect(isTaskOverdue(futureDate, false)).toBeFalsy();
      });

      test('Missing or null due date should safely return false without exception', () => {
        expect(isTaskOverdue(null, false)).toBeFalsy();
        expect(isTaskOverdue('', false)).toBeFalsy();
      });
    });

    // --- SUITE 2: Task 2: Task CRUD State Manipulations ---
    describe('Task 2: Task CRUD State Management', () => {
      let mockTasks = [];

      test('Add Task: Unshift creates task at the head of array', () => {
        const newTask = {
          id: 'test_1',
          title: 'Learn Array Methods',
          category: 'Study',
          priority: 'High',
          dueDate: getFormattedDateOffset(1),
          completed: false
        };
        mockTasks.unshift(newTask);
        expect(mockTasks.length).toBe(1);
        expect(mockTasks[0].title).toBe('Learn Array Methods');
      });

      test('Toggle Status: Inverts completed boolean and preserves other fields', () => {
        mockTasks[0].completed = !mockTasks[0].completed;
        expect(mockTasks[0].completed).toBe(true);
        mockTasks[0].completed = !mockTasks[0].completed;
        expect(mockTasks[0].completed).toBe(false);
      });

      test('Edit Task: Correctly mutates existing object by ID', () => {
        const targetId = 'test_1';
        const index = mockTasks.findIndex(t => t.id === targetId);
        mockTasks[index] = {
          ...mockTasks[index],
          title: 'Master Array Methods',
          priority: 'Medium'
        };
        expect(mockTasks[0].title).toBe('Master Array Methods');
        expect(mockTasks[0].priority).toBe('Medium');
      });

      test('Delete Task: Splice removes task from array', () => {
        const index = mockTasks.findIndex(t => t.id === 'test_1');
        const deleted = mockTasks.splice(index, 1);
        expect(deleted.length).toBe(1);
        expect(mockTasks.length).toBe(0);
      });
    });

    // --- SUITE 3: Task 4: Filter & Sort Pipelines ---
    describe('Task 4: Filtering, Searching & Multi-Sort Pipeline', () => {
      const sampleSet = [
        { id: '1', title: 'JavaScript Homework', description: 'Week 5 project', category: 'Study', priority: 'High', dueDate: getFormattedDateOffset(1), completed: false },
        { id: '2', title: 'Team Meeting Prep', description: 'Sprint sync', category: 'Work', priority: 'Medium', dueDate: getFormattedDateOffset(0), completed: false },
        { id: '3', title: 'Gym Workout', description: 'Leg day routine', category: 'Health', priority: 'Low', dueDate: getFormattedDateOffset(2), completed: true },
        { id: '4', title: 'Pay Electricity Bill', description: 'Overdue bill', category: 'Finance', priority: 'High', dueDate: getFormattedDateOffset(-2), completed: false }
      ];

      test('Filter by Status: Pending returns only uncompleted tasks', () => {
        const pending = sampleSet.filter(t => !t.completed);
        expect(pending.length).toBe(3);
      });

      test('Filter by Status: Overdue returns only uncompleted overdue tasks', () => {
        const overdue = sampleSet.filter(t => isTaskOverdue(t.dueDate, t.completed));
        expect(overdue.length).toBe(1);
        expect(overdue[0].id).toBe('4');
      });

      test('Filter by Category: Study returns matching category', () => {
        const study = sampleSet.filter(t => t.category === 'Study');
        expect(study.length).toBe(1);
        expect(study[0].title).toBe('JavaScript Homework');
      });

      test('Instant Live Search: Matches case-insensitively on description', () => {
        const query = 'routine'.toLowerCase();
        const results = sampleSet.filter(t => 
          t.title.toLowerCase().includes(query) || 
          (t.description && t.description.toLowerCase().includes(query))
        );
        expect(results.length).toBe(1);
        expect(results[0].title).toBe('Gym Workout');
      });

      test('Sort: Priority High to Low sorts High (3) before Medium (2) before Low (1)', () => {
        const sorted = [...sampleSet].sort((a, b) => PRIORITY_WEIGHTS[b.priority] - PRIORITY_WEIGHTS[a.priority]);
        expect(PRIORITY_WEIGHTS[sorted[0].priority]).toBe(3);
        expect(PRIORITY_WEIGHTS[sorted[sorted.length - 1].priority]).toBe(1);
      });

      test('Sort: Alphabetical A-Z sorts titles correctly', () => {
        const sorted = [...sampleSet].sort((a, b) => a.title.localeCompare(b.title));
        expect(sorted[0].title).toBe('Gym Workout');
        expect(sorted[sorted.length - 1].title).toBe('Team Meeting Prep');
      });
    });

    // --- SUITE 4: Task 5: Dashboard Statistics & Reduce ---
    describe('Task 5: Dashboard Statistics & Array.prototype.reduce', () => {
      const statsTasks = [
        { id: '1', category: 'Work', completed: true, dueDate: '2026-11-01' },
        { id: '2', category: 'Work', completed: true, dueDate: '2026-11-02' },
        { id: '3', category: 'Study', completed: false, dueDate: '2026-11-03' },
        { id: '4', category: 'Personal', completed: false, dueDate: '2026-11-04' }
      ];

      test('Calculates exact completion percentage: 2/4 = 50%', () => {
        const completed = statsTasks.filter(t => t.completed).length;
        const rate = Math.round((completed / statsTasks.length) * 100);
        expect(rate).toBe(50);
      });

      test('Reduce accurately calculates category breakdown distribution', () => {
        const breakdown = statsTasks.reduce((acc, t) => {
          acc[t.category] = (acc[t.category] || 0) + 1;
          return acc;
        }, {});
        expect(breakdown['Work']).toBe(2);
        expect(breakdown['Study']).toBe(1);
        expect(breakdown['Personal']).toBe(1);
      });

      test('Zero tasks handles 0% rate without NaN division errors', () => {
        const emptyTasks = [];
        const rate = emptyTasks.length > 0 ? Math.round((0 / emptyTasks.length) * 100) : 0;
        expect(rate).toBe(0);
      });
    });

    // --- SUITE 5: Task 6: LocalStorage Serialization & Safety ---
    describe('Task 6: LocalStorage Persistence & Error Handling', () => {
      const testKey = 'test_suite_storage_key';

      test('JSON.stringify and parse correctly preserves task schema', () => {
        const payload = [{ id: 'k1', title: 'Persist Test', completed: true }];
        localStorage.setItem(testKey, JSON.stringify(payload));
        const retrieved = JSON.parse(localStorage.getItem(testKey));
        expect(Array.isArray(retrieved)).toBeTruthy();
        expect(retrieved[0].title).toBe('Persist Test');
        localStorage.removeItem(testKey);
      });

      test('Corrupted JSON gracefully falls back to empty array', () => {
        let result = [];
        try {
          result = JSON.parse('INVALID_JSON_STRING{{{');
        } catch {
          result = [];
        }
        expect(result.length).toBe(0);
      });
    });

    /* ==========================================================================
       RENDER TEST RESULTS TO DOM
       ========================================================================== */
    const suitesContainer = document.getElementById('suitesContainer');
    let totalCount = 0;
    let passedCount = 0;
    let failedCount = 0;

    TestRunner.suites.forEach(suite => {
      const suiteSection = document.createElement('section');
      suiteSection.className = 'test-suite';
      suiteSection.style.marginBottom = '20px';

      const suiteHeader = document.createElement('div');
      suiteHeader.className = 'suite-header';
      suiteHeader.innerHTML = `<span>📂 ${suite.name}</span><span style="font-size:0.8rem; color:var(--muted);">${suite.tests.length} tests</span>`;
      suiteSection.appendChild(suiteHeader);

      const testList = document.createElement('ul');
      testList.className = 'test-list';

      suite.tests.forEach(t => {
        totalCount++;
        if (t.passed) passedCount++; else failedCount++;

        const li = document.createElement('li');
        li.className = 'test-item';
        li.innerHTML = `
          <div class="test-name">
            <span class="test-badge ${t.passed ? 'badge-pass' : 'badge-fail'}">
              ${t.passed ? '✓' : '✗'}
            </span>
            <div>
              <span>${t.name}</span>
              ${t.errorMessage ? `<div class="error-trace">${t.errorMessage}</div>` : ''}
            </div>
          </div>
          <span class="test-time">${t.duration}ms</span>
        `;
        testList.appendChild(li);
      });

      suiteSection.appendChild(testList);
      suitesContainer.appendChild(suiteSection);
    });

    document.getElementById('totalTests').textContent = totalCount;
    document.getElementById('passedTests').textContent = passedCount;
    document.getElementById('failedTests').textContent = failedCount;
    const rate = totalCount > 0 ? Math.round((passedCount / totalCount) * 100) : 0;
    document.getElementById('passRate').textContent = `${rate}%`;
  </script>
</body>
</html>
