<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="darkCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="675" fill="url(#darkBg)"/>

  <!-- Top App Header Dark -->
  <rect x="0" y="0" width="1200" height="70" fill="#111827" stroke="#1f2937"/>
  <rect x="40" y="18" width="34" height="34" rx="8" fill="#4f46e5"/>
  <path d="M50 35 L55 40 L64 28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="38" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#f8fafc">SmartTask<tspan fill="#818cf8">Pro</tspan></text>
  <rect x="220" y="24" width="115" height="22" rx="11" fill="#1e293b"/>
  <text x="232" y="39" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">DARK SAAS MODE</text>

  <!-- Metric KPI Cards Grid Dark -->
  <g transform="translate(40, 95)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="55" font-size="20">📋</text>
    <text x="75" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">TOTAL TASKS</text>
    <text x="75" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">5</text>

    <!-- Card 2 -->
    <rect x="286" y="0" width="260" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="311" y="55" font-size="20">⏳</text>
    <text x="361" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">IN PROGRESS</text>
    <text x="361" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">3</text>

    <!-- Card 3 -->
    <rect x="572" y="0" width="260" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="597" y="55" font-size="20">✅</text>
    <text x="647" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#34d399">COMPLETED</text>
    <text x="647" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">2</text>

    <!-- Card 4 -->
    <rect x="858" y="0" width="262" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="883" y="55" font-size="20">⚠️</text>
    <text x="933" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f87171">OVERDUE</text>
    <text x="933" y="72" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#f87171">1</text>
  </g>

  <!-- Progress Bar Section Dark -->
  <g transform="translate(40, 215)">
    <rect x="0" y="0" width="1120" height="75" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Overall Productivity Goal</text>
    <text x="24" y="52" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">💪 Halfway there! Keep up the great momentum!</text>
    <text x="1050" y="44" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#818cf8">40%</text>
    <rect x="24" y="60" width="1072" height="8" rx="4" fill="#0f172a"/>
    <rect x="24" y="60" width="428" height="8" rx="4" fill="#6366f1"/>
  </g>

  <!-- Dark Mode Task Card -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="1120" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="24" y="34" width="22" height="22" rx="6" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="64" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Complete InternNova Week 5 JavaScript Project</text>
    <text x="64" y="58" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1">Implement full CRUD, filtering, statistics, and LocalStorage persistence with clean code documentation.</text>
    <rect x="64" y="66" width="95" height="18" rx="9" fill="rgba(239, 68, 68, 0.2)"/>
    <text x="76" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#f87171">● High Priority</text>
    <rect x="168" y="66" width="70" height="18" rx="9" fill="rgba(34, 197, 94, 0.2)"/>
    <text x="178" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#86efac">📚 Study</text>
  </g>

  <!-- Delete Toast Notification with Undo -->
  <g transform="translate(780, 560)" filter="url(#darkCardShadow)">
    <rect width="380" height="65" rx="10" fill="#111827" stroke="#334155"/>
    <circle cx="28" cy="32" r="14" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="21" y="38" font-size="14">⚠️</text>
    <text x="52" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Task was removed.</text>
    <text x="52" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-decoration="underline">Undo Action</text>
    <text x="350" y="35" font-family="Inter, sans-serif" font-size="16" fill="#64748b">×</text>
  </g>
</svg>
