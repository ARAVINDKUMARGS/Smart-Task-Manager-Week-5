<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" filter="url(#shadow4)"/>
  <text x="40" y="42" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#0f172a">SmartTask<tspan fill="#4f46e5">Pro</tspan> — Task Status &amp; Action Controls</text>

  <!-- Task Action Comparison Grid -->
  <g transform="translate(40, 100)">
    <!-- Case 1: In Progress / High Priority Task -->
    <text x="0" y="-10" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">1. Active In-Progress Task (Due Tomorrow)</text>
    <rect width="1120" height="90" rx="12" fill="#ffffff" filter="url(#shadow4)"/>
    <rect x="24" y="34" width="22" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Prepare Weekly Sprint Presentation</text>
    <text x="64" y="58" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Create slide deck highlighting user metrics, code architecture, and key performance milestones.</text>
    <rect x="64" y="66" width="95" height="18" rx="9" fill="#fef2f2"/>
    <text x="76" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dc2626">● High Priority</text>
    <rect x="168" y="66" width="70" height="18" rx="9" fill="#eef2ff"/>
    <text x="178" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#4338ca">💼 Work</text>
    <!-- Action buttons -->
    <rect x="1020" y="28" width="36" height="36" rx="6" fill="#eef2ff"/>
    <text x="1031" y="51" font-size="16">✏️</text>
    <rect x="1066" y="28" width="36" height="36" rx="6" fill="#fef2f2"/>
    <text x="1077" y="51" font-size="16">🗑️</text>

    <!-- Case 2: Overdue Critical Task -->
    <g transform="translate(0, 140)">
      <text x="0" y="-10" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#dc2626">2. Overdue Critical Task (Urgent Red Indicator &amp; Left Border)</text>
      <rect width="1120" height="90" rx="12" fill="#ffffff" filter="url(#shadow4)"/>
      <rect x="0" y="0" width="6" height="90" rx="3" fill="#ef4444"/>
      <rect x="24" y="34" width="22" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="64" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Schedule Annual Dental Checkup</text>
      <text x="64" y="58" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Call clinic reception to confirm booking for routine dental prophylaxis and checkup.</text>
      <rect x="64" y="66" width="145" height="18" rx="9" fill="#fee2e2"/>
      <text x="76" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dc2626">⚠️ Overdue by 2 days</text>
      <rect x="218" y="66" width="70" height="18" rx="9" fill="#fff1f2"/>
      <text x="228" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#be123c">🧘 Health</text>
      <!-- Action buttons -->
      <rect x="1020" y="28" width="36" height="36" rx="6" fill="#eef2ff"/>
      <text x="1031" y="51" font-size="16">✏️</text>
      <rect x="1066" y="28" width="36" height="36" rx="6" fill="#fef2f2"/>
      <text x="1077" y="51" font-size="16">🗑️</text>
    </g>

    <!-- Case 3: Completed Task -->
    <g transform="translate(0, 280)">
      <text x="0" y="-10" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#059669">3. Completed Task (Checkmark Strikethrough &amp; Dimmed State)</text>
      <rect width="1120" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="24" y="34" width="22" height="22" rx="6" fill="#10b981"/>
      <path d="M30 45 L34 49 L40 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="64" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-decoration="line-through">Monthly Budget Planning &amp; Expense Audit</text>
      <text x="64" y="58" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">Review bank statements, track recurring subscription charges, and set investment targets.</text>
      <rect x="64" y="66" width="90" height="18" rx="9" fill="#ecfdf5"/>
      <text x="76" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#059669">✓ Completed</text>
      <rect x="164" y="66" width="80" height="18" rx="9" fill="#ecfeff"/>
      <text x="174" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e7490">💰 Finance</text>
      <!-- Action buttons -->
      <rect x="1020" y="28" width="36" height="36" rx="6" fill="#f1f5f9"/>
      <text x="1031" y="51" font-size="16">✏️</text>
      <rect x="1066" y="28" width="36" height="36" rx="6" fill="#fef2f2"/>
      <text x="1077" y="51" font-size="16">🗑️</text>
    </g>
  </g>
</svg>
