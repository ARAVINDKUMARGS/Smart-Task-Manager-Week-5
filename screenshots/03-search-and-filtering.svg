<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" filter="url(#shadow3)"/>
  <text x="40" y="42" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#0f172a">SmartTask<tspan fill="#4f46e5">Pro</tspan> — Live Search &amp; Filter Active</text>

  <!-- Controls Bar with Active Filters -->
  <g transform="translate(40, 90)">
    <rect width="1120" height="130" rx="12" fill="#ffffff" filter="url(#shadow3)"/>
    
    <!-- Search Bar with Query "JavaScript" -->
    <rect x="20" y="16" width="600" height="42" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
    <text x="35" y="42" font-size="16">🔍</text>
    <text x="65" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f172a">JavaScript</text>
    <text x="590" y="41" font-family="Inter, sans-serif" font-size="16" fill="#94a3b8">×</text>

    <!-- Status Tabs -->
    <rect x="640" y="16" width="460" height="42" rx="8" fill="#f1f5f9"/>
    <rect x="644" y="20" width="110" height="34" rx="6" fill="#ffffff" filter="url(#shadow3)"/>
    <text x="670" y="42" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#4f46e5">All (2)</text>
    <text x="775" y="42" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b">Pending (1)</text>
    <text x="880" y="42" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b">Completed (1)</text>
    <text x="1000" y="42" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748b">Overdue (0)</text>

    <!-- Bottom Filter Line -->
    <line x1="20" y1="72" x2="1100" y2="72" stroke="#f1f5f9"/>
    <text x="24" y="105" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Filter by: </text>
    <rect x="90" y="85" width="150" height="32" rx="6" fill="#f1f5f9"/>
    <text x="105" y="106" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">📚 Study (Active)</text>

    <rect x="255" y="85" width="140" height="32" rx="6" fill="#f1f5f9"/>
    <text x="270" y="106" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">⚡ All Priorities</text>

    <rect x="410" y="85" width="190" height="32" rx="6" fill="#f1f5f9"/>
    <text x="425" y="106" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">📅 Due Date (Ascending)</text>

    <!-- Active Count Indicator & Reset Pill -->
    <text x="890" y="106" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Showing <tspan font-weight="700" fill="#0f172a">2</tspan> of 5 tasks</text>
    <rect x="1010" y="86" width="90" height="28" rx="6" fill="#fee2e2"/>
    <text x="1025" y="105" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#dc2626">✕ Reset</text>
  </g>

  <!-- Filtered Tasks Matching "JavaScript" -->
  <g transform="translate(40, 245)">
    <!-- Task 1 -->
    <rect width="1120" height="95" rx="12" fill="#ffffff" filter="url(#shadow3)"/>
    <rect x="24" y="36" width="22" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="40" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Complete InternNova Week 5 <tspan fill="#4f46e5" font-weight="800">JavaScript</tspan> Project</text>
    <text x="64" y="62" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Implement full CRUD, filtering, statistics, and LocalStorage persistence with clean code documentation.</text>
    <rect x="64" y="70" width="95" height="18" rx="9" fill="#fef2f2"/>
    <text x="76" y="83" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dc2626">● High Priority</text>
    <rect x="168" y="70" width="70" height="18" rx="9" fill="#f0fdf4"/>
    <text x="178" y="83" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#15803d">📚 Study</text>

    <!-- Task 2 -->
    <g transform="translate(0, 115)">
      <rect width="1120" height="95" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="24" y="36" width="22" height="22" rx="6" fill="#10b981"/>
      <path d="M30 47 L34 51 L40 42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="64" y="40" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-decoration="line-through">Review <tspan font-weight="700">JavaScript</tspan> Array Methods (map, filter, reduce)</text>
      <text x="64" y="62" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">Deep dive into functional programming principles and immutable state transformations.</text>
      <rect x="64" y="70" width="85" height="18" rx="9" fill="#ecfdf5"/>
      <text x="74" y="83" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#059669">✓ Completed</text>
    </g>
  </g>
</svg>
